<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:">
<title>WHENCOMMAND</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* 시안 §5 ① — 스크립트의 짧은 출력. 패널과 같은 표면·같은 칩 어법 */
html, body { background: transparent; height: 100%; overflow: hidden; }
body { padding: 12px; user-select: none; }
.toast {
  display: flex; gap: 11px; align-items: flex-start; padding: 12px 14px;
  background: rgba(22,23,28,.97); border: 1px solid rgba(255,255,255,.11); border-radius: var(--r-md);
  box-shadow: 0 12px 36px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
}
.ic { width: 26px; height: 26px; border-radius: 7px; flex: none; display: grid; place-items: center;
      background: rgba(158,206,106,.16); color: var(--success); font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
.tx { min-width: 0; flex: 1; }
.t { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-primary); line-height: 1.5; white-space: pre-wrap; word-break: break-all;
     max-height: calc(1.5em * 3); overflow: hidden; }
.b.none { color: var(--text-muted); font-family: var(--font-sans); }
.m { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 10.5px; color: var(--text-muted); font-family: var(--font-mono); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; background: var(--bg-inset); border: 1px solid var(--border);
        border-radius: 99px; padding: 1px 8px; }
.chip .d { width: 6px; height: 6px; border-radius: 99px; background: var(--success); }
</style>
</head>
<body>
<div class="toast">
  <span class="ic" id="ic">$</span>
  <div class="tx">
    <div class="t" id="t"></div>
    <div class="b" id="b"></div>
    <div class="m" id="m"></div>
  </div>
</div>
<script src="toast.js"></script>
</body>
</html>
