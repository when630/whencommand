<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:">
<title>WHENCOMMAND</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* 시안 ㉤ 출처 칩 — design/mockups/panel-options.html §0 확정(D-15). 행 40px · 폭 560px · 최대 8줄. 하단 바는 뺐다(2026-09-21). */
html, body { background: transparent; height: 100%; overflow: hidden; }
body { padding: 28px; user-select: none; }             /* 28px = main/panel.mjs PAD — 그림자 여백 */
.panel {
  width: 560px; background: rgba(22,23,28,.97); border: 1px solid rgba(255,255,255,.11);
  border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 18px 56px rgba(0,0,0,.62), 0 3px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
}
/* 입력 행을 잡고 끈다(D-19). 입력창 자체는 글자를 골라야 하니 뺀다 */
.q { display: flex; align-items: center; gap: 11px; padding: 0 16px; height: 54px; flex: none; -webkit-app-region: drag; }
.q input { -webkit-app-region: no-drag; }
/* 입력 행 왼쪽은 앱 글리프(⌘) — 트레이와 같은 build/tray@2x.png. 돋보기는 "검색"을 말하지만 이 앱은 검색이 아니라 실행이다 */
.q .gi { width: 18px; height: 18px; flex: none; }
.q .gi img { width: 100%; height: 100%; object-fit: contain; display: block; -webkit-user-drag: none; }
.q input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text-primary);
           font: inherit; font-size: 16.5px; letter-spacing: -.2px; caret-color: var(--accent); }
.q input::placeholder { color: var(--text-muted); }
.q .hint { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); flex: none; }
.q .hint.busy { color: var(--accent); }
.sep { height: 1px; background: var(--border); flex: none; }
.sep:has(+ .list:empty + #extra:empty) { display: none; } /* 아래에 아무것도 없으면 입력 행 하나로 끝난다 */
.list { padding: 6px; display: flex; flex-direction: column; gap: 1px; }
.list:empty { display: none; }
.row { display: flex; align-items: center; gap: 11px; padding: 0 10px; height: 40px; border-radius: var(--r-sm); flex: none; position: relative; cursor: default; }
.row.sel { background: var(--accent-dim); }
.row.sel::before { content: ""; position: absolute; left: 3px; top: 9px; bottom: 9px; width: 2.5px; border-radius: 2px; background: var(--accent); }
.ic { width: 24px; height: 24px; border-radius: 6px; flex: none; display: grid; place-items: center;
      font-size: 11px; font-weight: 700; color: #fff; letter-spacing: -.3px; }
.ic.calc { background: var(--accent-dim); color: var(--accent); font-family: var(--font-mono); }
.tin { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 8px; overflow: hidden; }
.tt { font-size: 13.5px; font-weight: 550; letter-spacing: -.15px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt em { font-style: normal; color: var(--accent); font-weight: 700; }
.sb { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 45%; }
.chip { flex: none; font-size: 10px; font-family: var(--font-mono); color: var(--text-muted); background: var(--bg-inset);
        border: 1px solid var(--border); border-radius: 99px; padding: 1px 8px; display: inline-flex; align-items: center; gap: 5px; }
.chip .d { width: 6px; height: 6px; border-radius: 99px; flex: none; background: var(--text-muted); }
.chip.sib { color: #8fa9d8; } .chip.sib .d { background: var(--accent); }
.chip.scr .d { background: var(--success); }
.kb { flex: none; font-family: var(--font-mono); font-size: 10px; background: var(--bg-inset); border: 1px solid var(--border);
      border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--text-muted); line-height: 1.4; visibility: hidden; }
.row.sel .kb { visibility: visible; }
/* 계산 결과 — 값은 고정폭 21px. 검색 결과가 아니라 값이라는 걸 크기로 말한다 */
.row.calc { height: 56px; }
.row.calc .tt { font-family: var(--font-mono); font-size: 21px; font-weight: 640; letter-spacing: -.5px; }
.row.calc .sb { font-family: var(--font-mono); font-size: 13px; max-width: none; }
.ic.scr { background: rgba(158,206,106,.16); color: var(--success); font-family: var(--font-mono); font-size: 12px; }
/* 스크립트 출력 모드(시안 §5 ②·③, EXT-04·05) — 입력창 자리에 초록 이름표, 아래는 고정폭 출력. 실패면 --danger */
.q .tag { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: var(--success); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel.failed .q .tag, .panel.failed .q .hint { color: var(--danger); }
.panel.outmode .sep { display: none; }
.out-head { display: flex; align-items: center; gap: 6px; padding: 6px 14px; font-size: 10.5px; color: var(--text-muted); font-family: var(--font-mono);
            border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: rgba(0,0,0,.18); }
.out-head .st { font-size: 10px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--border); background: var(--bg-inset); }
.out-head .st.ok { color: var(--success); } .out-head .st.bad { color: var(--danger); }
.out-head .sp { flex: 1; }
.out-head kbd { font-family: var(--font-mono); font-size: 10px; background: var(--bg-inset); border: 1px solid var(--border);
                border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; margin-left: 4px; color: var(--text-secondary); }
.outbody { margin: 0; padding: 10px 14px 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.55; color: var(--text-primary);
           white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto; user-select: text; }
.outbody .dim { color: var(--text-muted); }
.empty { padding: 22px 16px 24px; text-align: center; }
.empty .t1 { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
.empty .t2 { font-size: 11.5px; color: var(--text-muted); line-height: 1.7; }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="q">
    <span class="gi"><img src="../build/tray@2x.png" alt=""></span>
    <input id="q" type="text" placeholder="WHENCOMMAND" autocomplete="off" spellcheck="false">
    <span class="tag" id="qtag" hidden></span>
    <span class="hint" id="hint"></span>
  </div>
  <div class="sep"></div>
  <div class="list" id="list"></div>
  <div id="extra"></div>
  <div id="out" hidden></div>
</div>
<script src="panel.js"></script>
</body>
</html>
