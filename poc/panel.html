<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>whencommand poc</title>
<style>
/* 토큰은 형제 앱 renderer/tokens.css 사본 — 측정용이라 최소만 */
:root{--bg:rgba(22,23,28,.97);--bd:#2e323d;--t1:#e6e8ee;--t2:#a8afbd;--t3:#7b8294;--ac:#7aa2f7;--acd:rgba(122,162,247,.14);--ok:#9ece6a;--bad:#f7768e;
 --sans:"Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif;--mono:"Cascadia Code",D2Coding,Consolas,monospace}
*{box-sizing:border-box;margin:0}html,body{background:transparent;height:100%}
body{font-family:var(--sans);color:var(--t1);font-size:13px;-webkit-font-smoothing:antialiased;user-select:none}
.panel{width:560px;height:330px;background:var(--bg);border:1px solid rgba(255,255,255,.11);border-radius:14px;overflow:hidden;
 box-shadow:0 18px 56px rgba(0,0,0,.62),0 3px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);display:flex;flex-direction:column}
.q{height:54px;display:flex;align-items:center;gap:11px;padding:0 16px;border-bottom:1px solid var(--bd);flex:none}
.q input{flex:1;background:none;border:0;outline:0;color:var(--t1);font:inherit;font-size:16.5px;letter-spacing:-.2px}
.q input::placeholder{color:var(--t3)}
.q .h{font-family:var(--mono);font-size:10px;color:var(--t3)}
.st{padding:8px 6px;display:flex;flex-direction:column;gap:1px;flex:1;overflow:hidden}
.r{display:flex;align-items:center;gap:10px;padding:0 10px;height:36px;border-radius:6px;font-size:12.5px}
.r .k{color:var(--t2);flex:1}.r .v{font-family:var(--mono);font-size:11.5px;color:var(--t1)}
.r .v.ok{color:var(--ok)}.r .v.bad{color:var(--bad)}.r .v.dim{color:var(--t3)}
.foot{height:34px;display:flex;align-items:center;gap:12px;padding:0 14px;border-top:1px solid var(--bd);font-size:10.5px;color:var(--t3);flex:none}
.foot .sp{flex:1}kbd{font-family:var(--mono);font-size:10px;background:#131419;border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--t2)}
</style></head><body>
<div class="panel">
  <div class="q"><input id="q" placeholder="PoC — 단축키를 눌러 보세요" autofocus><span class="h" id="h">측정 중…</span></div>
  <div class="st" id="st"></div>
  <div class="foot"><span>whencommand poc</span><span class="sp"></span><kbd>esc</kbd> 숨김 <kbd>⌃⌥L</kbd> 재측정 <kbd>⌃⌥Q</kbd> 종료</div>
</div>
<script>
// #6 — show() 직후 메인이 'shown'을 보낸다. 두 프레임 뒤가 첫 페인트다.
window.poc.onShown(() => requestAnimationFrame(() => requestAnimationFrame(() => window.poc.painted(Date.now()))))

const st = document.getElementById('st'), h = document.getElementById('h')
const row = (k, v, cls = '') => `<div class="r"><span class="k">${k}</span><span class="v ${cls}">${v}</span></div>`
const ms = (x) => x == null ? ['—', 'dim'] : [`${x}ms`, x <= 120 ? 'ok' : 'bad']
window.poc.onStats((s) => {
  h.textContent = s.autoDone ? '자동 측정 끝' : '측정 중…'
  const sc = Object.entries(s.shortcuts).map(([a, v]) =>
    row(`${a}`, `reg=${v.registerReturned} · ${v.fires}회 눌림`, v.fires > 0 ? 'ok' : (v.registerReturned ? 'dim' : 'bad'))).join('')
  const [p, pc] = ms(s.prebuilt), [f, fc] = ms(s.fresh), [k, kc] = ms(s.hotkey)
  const hk = (s.hotkeyFocus || []).slice(-2).map(x => row(`#7 ${x.accel} (${x.mode})`, `${x.activated ? '활성화 ✓' : '활성화 ✗'} · 타이핑 ${x.typed}글자${x.after ? ' · 복귀 ' + x.after : ''}`, x.typed > 0 ? 'ok' : 'dim')).join('')
  const fo = hk + s.focus.map(x => row(`#7 ${x.method}`, x.activated === false ? `활성화 ✗ · 키입력 ${x.keyWindow}` : `${x.before} → ${x.after}`, x.activated === false ? 'bad' : (x.restored ? 'ok' : 'bad'))).join('')
  st.innerHTML = row('#3 Dock 숨김', s.dock && 'isVisible' in s.dock ? (s.dock.isVisible ? '보임 ✗' : '숨김 ✓') : 'n/a', s.dock?.isVisible === false ? 'ok' : 'dim')
    + row('#6 미리 만든 창 → 페인트 (중앙값)', p, pc) + row('#6 새 창 → 페인트 (중앙값)', f, fc) + row('#6 단축키 → 페인트', k, kc)
    + fo + sc
})
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.poc.hide() })
const q = document.getElementById('q')
q.addEventListener('input', () => window.poc.typed(q.value.length))
window.poc.onShown(() => { q.value = ''; q.focus() })
</script></body></html>
