# 태그를 밀면 Windows·macOS 설치 파일을 만들어 Releases 드래프트에 올린다(REL-01·02). WHENNOTE release.yml을 복사했다(D-14).
#
# 서명하지 않는다. CSC_IDENTITY_AUTO_DISCOVERY=false가 그것을 못 박는다 —
# 이 값을 빼면 electron-builder가 러너 키체인에서 아무 인증서나 집어가려다
# 빌드를 실패시키거나, 더 나쁘게는 의도하지 않은 것으로 서명한다.
name: release

on:
  push:
    tags: ['v*']
  # 태그 없이 빌드만 확인하고 싶을 때 (업로드하지 않는다)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build
            artifact: |
              dist/*.exe
              dist/latest.yml
          - os: macos-latest
            script: build:mac
            artifact: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 패키징 전에 진짜 Electron으로 한 번 돌려 본다 — 렌더러가 깨진 채로 설치 파일이 나가는 것을 막는다.
      # 이 앱의 smoke는 입력줄을 실제로 띄워 캡처한다(양 OS 러너에는 데스크톱 세션이 있다). 앱 0개·단축키 실패면 1로 끝난다.
      - name: smoke
        run: npm run smoke
        env:
          ELECTRON_DISABLE_SANDBOX: 1

      # 여기서는 만들기만 한다. 올리는 것은 아래 publish 잡 하나가 맡는다 —
      # 빌드 스크립트의 --publish never가 없고 GH_TOKEN까지 있으면 electron-builder가
      # 태그를 보고 스스로 드래프트 릴리스를 하나 더 만들어 태그마다 릴리스가 둘이 된다.
      - name: build
        run: npm run ${{ matrix.script }}
        env:
          # 미서명 배포 — 러너 키체인을 뒤지지 않게 못 박는다
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # latest.yml / latest-mac.yml이 함께 올라가야 electron-updater가 새 버전을 본다 —
      # 설치 파일만 올리면 앱은 영영 "아직 올라온 릴리스가 없습니다"라고 말한다.
      - name: 올릴 파일 확인
        run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true # 사람이 내용을 보고 공개한다 — 자동으로 공개하지 않는다
          generate_release_notes: true
