# 푸시·PR마다 순수 함수 테스트를 두 OS에서 돈다(REL-03). 이 앱은 검색·랭킹·계산·매니페스트·스크립트 헤더가 전부
# Electron 없이 도는 순수 함수라 헤드리스에 아무것도 필요 없다 — 형제 앱과 달리 xvfb도 없다.
# 두 OS인 이유: platform.test가 두 구현의 계약을 파일로 검사하지만, 경로 구분자·줄끝(CRLF)·PowerShell 유무처럼
# OS가 갈라 놓는 것은 실제로 그 OS에서 돌려야 드러난다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 액션은 전부 node24 메이저(2026-10-19 — node20 deprecated 경고). ubuntu는 이름으로 못 박는다 — ubuntu-latest가 2026-10-19~11-19에
# 24.04→26.04로 몇 주에 걸쳐 바뀌어 그 사이엔 같은 커밋이 실행마다 다른 OS에서 돈다. 다음 LTS 때 여기를 같이 올린다
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # postinstall이 아이콘을 굽는다(tools/make-icon.mjs) — 외부 의존성 없이 zlib만 쓴다
      - run: npm ci
      - run: npm test
